<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>p3zo/rhythmic-relationships</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2c313a; --text: #e6e8ec;
    --dim: #8b93a1; --in: #6aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .head { display: flex; align-items: baseline; gap: 16px; }
  h1 { font-size: 21px; margin: 0; font-weight: 600; flex: 1;
       font-family: ui-monospace, monospace; letter-spacing: -.02em; }
  h1 a { color: var(--text); text-decoration: none; }
  h1 a:hover { color: var(--in); }
  h2 { font-size: 13px; margin: 0 0 14px; font-weight: 600; letter-spacing: .07em;
       text-transform: uppercase; color: var(--dim); }
  .meta { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 18px; margin-top: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .label { width: 120px; flex: none; color: var(--dim); font-size: 12px; text-align: right; }
  .grid { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .cell { height: 34px; border-radius: 3px; background: #23272f; }
  .cell.beat, .prob.beat, .mini i.beat { margin-left: 3px; }
  .cell.bar, .prob.bar, .mini i.bar { margin-left: 9px; }
  .in .cell { cursor: pointer; }
  .in .cell:hover { outline: 1px solid var(--in); }
  .prob { height: 26px; background: #23272f; border-radius: 3px; display: flex;
          align-items: flex-end; overflow: hidden; }
  .prob i { display: block; width: 100%; background: #4b5563; }
  button, select { background: #262b33; color: var(--text); border: 1px solid var(--line);
                   border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #4a5568; }
  button:disabled { opacity: .38; cursor: default; }
  button.primary { background: var(--in); color: #08121f; border-color: var(--in); font-weight: 600; }
  button.playing { background: #3b2226; border-color: #a24a54; color: #ffd9dc; }
  input[type=range] { width: 130px; vertical-align: middle; }
  label.check { color: var(--dim); font-size: 12px; cursor: pointer; user-select: none; }
  table { border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 12px; }
  th, td { text-align: right; padding: 3px 12px 3px 0; }
  th { color: var(--dim); font-weight: 500; }
  td.name { text-align: left; color: var(--dim); }
  .key { color: var(--dim); font-size: 11px; margin-top: 10px; font-family: ui-monospace, monospace; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 12px; }
  .hint { color: var(--dim); font-size: 12px; }
  .metrics { display: flex; gap: 22px; flex-wrap: wrap; font-family: ui-monospace, monospace;
             font-size: 11px; color: var(--dim); }
  .metrics b { display: block; font-size: 15px; font-weight: 600; color: var(--text); }
  .metrics.paired { margin-top: 12px; padding-top: 12px; border-top: 1px solid #23272f; }
  .metrics.paired b { color: #b98cff; }
  .steer { display: flex; flex-direction: column; gap: 6px; }
  .steer .line { display: flex; align-items: center; gap: 10px; font-size: 12px;
                 color: var(--dim); font-family: ui-monospace, monospace; }
  .steer .nm { width: 152px; flex: none; white-space: nowrap; }
  .steer .tv { width: 34px; }
  .steer .got { color: var(--text); }
  .steer .miss { color: #ff9a6a; }
  /* mashup rows */
  .match { display: flex; align-items: center; gap: 12px; padding: 5px 0;
           border-top: 1px solid #23272f; }
  .match:first-of-type { border-top: none; }
  .match .apart { width: 62px; flex: none; text-align: right; color: var(--dim);
                  font-family: ui-monospace, monospace; font-size: 12px; }
  .mini { display: grid; gap: 1px; flex: 1; min-width: 160px; }
  .mini i { display: block; height: 14px; border-radius: 2px; background: #23272f; }
  .match .who { width: 300px; flex: none; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; font-size: 12px; color: var(--dim); }
  .hdr { display: flex; gap: 12px; color: var(--dim); font-size: 11px;
         font-family: ui-monospace, monospace; padding-bottom: 6px; }
  .hdr .apart { width: 62px; flex: none; text-align: right; }
  .hdr .mid { flex: 1; min-width: 160px; }
  .hdr .who { width: 300px; flex: none; }
  .hdr .spacer { width: 44px; flex: none; }
  .match .shift { width: 40px; flex: none; text-align: right; color: var(--dim);
                  font-family: ui-monospace, monospace; font-size: 12px; }
  .hdr .shift { width: 40px; flex: none; text-align: right; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1><a href="https://github.com/p3zo/rhythmic-relationships" target="_blank"
           rel="noopener">p3zo/rhythmic-relationships</a></h1>
  </div>

  <div class="panel">
    <div class="row">
      <div class="label">model</div>
      <select id="model" style="flex:1;max-width:560px"></select>
      <label class="check"><input type="checkbox" id="click"> click track</label>
    </div>
  </div>

  <div class="panel">
    <h2>Input</h2>
    <div class="row">
      <div class="label" id="inLabel"></div>
      <div class="grid in" id="inGrid"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="label"></div>
      <div id="inDesc"></div>
      <span style="flex:1"></span>
      <span class="hint" id="inSeg"></span>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="label"></div>
      <button id="clear">Clear</button>
      <button id="rand">Random real input</button>
      <button id="preset">Straight 8ths</button>
      <span style="flex:1"></span>
      <button id="playIn">▶ rhythm</button>
      <button id="playPitched" disabled title="Load a real input to hear its pitches">▶ with pitches</button>
    </div>
  </div>

  <div class="panel">
    <h2>Output</h2>
    <div class="row">
      <div class="label" id="outLabel"></div>
      <div class="grid" id="outGrid"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="label">P(onset)</div>
      <div class="grid" id="probGrid"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="label">model</div>
      <span class="meta" id="meta">loading the model…</span>
      <span class="meta" id="valLoss"></span>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="label"></div>
      <button class="primary" id="gen">Generate ⏎</button>
      <select id="sampler">
        <option value="nucleus">nucleus</option>
        <option value="multinomial">multinomial</option>
        <option value="greedy">greedy</option>
      </select>
      <span class="hint">temperature <input type="range" id="temp" min="0.3" max="2" step="0.05" value="1">
        <span id="tempV">1.00</span></span>
      <span class="hint">nucleus p <input type="range" id="pp" min="0.5" max="1" step="0.01" value="0.92">
        <span id="ppV">0.92</span></span>
      <span style="flex:1"></span>
      <button id="playOut" disabled>▶ output</button>
      <button id="playBoth" disabled>▶ both</button>
    </div>
    <div class="key">
      <span class="sw" style="background:rgb(86,211,100)"></span>onset on an input onset
      <span class="sw" style="background:rgb(255,140,90)"></span>onset in an input gap
      <span class="sw" style="background:#4b5563"></span>the model's onset probability at that step
    </div>
    <div class="row" style="margin-top:14px">
      <div class="label">steer</div>
      <div id="steer" class="steer"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="label"></div>
      <div id="outDesc"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Mashups</h2>
    <div class="meta" id="mashupNote" style="margin-bottom:14px"></div>
    <div id="matches"><span class="hint">Generate to find real segments that move like the output.</span></div>
  </div>

</div>

<script>
let META = null;
let input = [];
let output = null;
let pitched = null;      // the real segment's notes, dropped as soon as the grid is edited
let exampleName = "";
let matches = [];

const $ = (id) => document.getElementById(id);
const midiHz = (n) => 440 * Math.pow(2, (n - 69) / 12);

// ---------- audio ----------
// One context at a time: starting anything stops whatever was playing, and the button that
// started it becomes its own stop button, so what you hear is always attributable.
let ctx = null;
let playing = null;
let noise = null;

function stopAll() {
  if (ctx) { ctx.close(); ctx = null; }
  noise = null;
  if (playing) {
    playing.btn.textContent = playing.label;
    playing.btn.classList.remove("playing");
    clearTimeout(playing.timer);
    playing = null;
  }
}

function noiseBuffer(ac) {
  if (!noise) {
    noise = ac.createBuffer(1, ac.sampleRate * 0.25, ac.sampleRate);
    const data = noise.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  return noise;
}

// A struck string, per partial: [harmonic, level, how much of the note's decay it lasts].
// Three things separate this from a toy piano: the upper partials die away while the
// fundamental is still ringing, each note is two strings a hair apart so the sustain beats
// against itself instead of sitting still, and a soft strike barely wakes the top of the
// spectrum at all.
const PIANO_PARTIALS = [
  [1, 1.00, 1.00], [2, 0.62, 0.68], [3, 0.38, 0.52], [4, 0.24, 0.42],
  [5, 0.15, 0.34], [6, 0.10, 0.28], [7, 0.07, 0.23], [8, 0.05, 0.20],
  [9, 0.035, 0.17], [10, 0.025, 0.15], [12, 0.015, 0.12],
];
// Real strings are stiff, so their partials sit slightly above whole multiples of the
// fundamental. This is why a piano sounds bright rather than perfectly in tune with itself.
const INHARMONICITY = 0.00035;
// How far the second string of a note sits from the first. Proportional, so middle C beats
// around once a second and the bass beats slower, which is how a real unison behaves.
const DETUNE = 0.0025;

function pianoNote(ac, at, midi, gain, velocity, pan, ring) {
  const p = ac.createStereoPanner();
  p.pan.value = pan;
  // Bare sines sound glassy however they are stacked; rolling the top off is most of what
  // turns the stack into an instrument
  const warm = ac.createBiquadFilter();
  warm.type = "lowpass";
  warm.frequency.value = 7000;
  warm.connect(p);
  p.connect(ac.destination);

  // Bass strings ring far longer than treble ones
  const seconds = Math.max(1, Math.min(5, ring * Math.pow(2, (60 - midi) / 22)));
  const freq = midiHz(midi);

  for (const [n, level, lasts] of PIANO_PARTIALS) {
    // A hard strike excites the upper partials; a soft one leaves them alone
    const amp = gain * velocity * level * Math.pow(velocity, (n - 1) * 0.35);
    const f = freq * n * Math.sqrt(1 + INHARMONICITY * n * n);
    if (amp < 1e-4 || f > 16000) continue;
    const decay = seconds * lasts;
    const strings = n <= 4 ? [1 - DETUNE, 1 + DETUNE] : [1];
    for (const detune of strings) {
      const g = ac.createGain();
      const start = amp / strings.length;
      g.gain.setValueAtTime(0, at);
      // Hammer-fast: any slower and it reads as bowed or blown rather than struck
      g.gain.linearRampToValueAtTime(start, at + 0.004);
      // Piano decay happens in two stages - a quick drop as the strings shed energy into the
      // soundboard, then a long aftersound. A single exponential to silence is the plink.
      g.gain.exponentialRampToValueAtTime(start * 0.45, at + decay * 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, at + decay);
      const osc = ac.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f * detune;
      osc.connect(g); g.connect(warm);
      osc.start(at); osc.stop(at + decay + 0.02);
    }
  }

  // The knock of the hammer, quiet enough to be felt rather than heard
  const knock = ac.createBufferSource();
  knock.buffer = noiseBuffer(ac);
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = Math.min(3500, freq * 8);
  const kg = ac.createGain();
  kg.gain.setValueAtTime(gain * velocity * 0.22, at);
  kg.gain.exponentialRampToValueAtTime(0.0001, at + 0.025);
  knock.connect(lp); lp.connect(kg); kg.connect(warm);
  knock.start(at); knock.stop(at + 0.04);
}

// A stick tap: a filtered noise burst with no pitch in it at all
function stickTap(ac, at, gain, pan) {
  const src = ac.createBufferSource();
  src.buffer = noiseBuffer(ac);
  const bp = ac.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 2600;
  bp.Q = 1.1;
  const hp = ac.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 800;
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.06);
  const p = ac.createStereoPanner();
  p.pan.value = pan;
  src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(p); p.connect(ac.destination);
  src.start(at); src.stop(at + 0.14);
}

// Both parts are the same grand piano, kept apart in the stereo field so it stays clear which
// one you are hearing.
const VOICES = {
  melody: { gain: 0.13, pan: -0.45, lift: 0, ring: 4 },
  // A bassline's fundamental is often below what a laptop speaker reproduces at all, so notes
  // under MIDI 45 are folded up by octaves into a register that can be heard. Folding by whole
  // octaves keeps the pitch class, so it cannot undo a mashup's transposition.
  bass:   { gain: 0.14, pan: 0.40, lift: 45, ring: 4 },
};

// Fold a note up by whole octaves until it clears `floorNote`, preserving its pitch class
function lift(pitch, floorNote) {
  let p = pitch;
  while (floorNote && p < floorNote) p += 12;
  return p;
}

// `parts` are {notes: [[step, pitch, velocity]], voice: "melody"|"bass"|"tap", pan?}
function play(parts) {
  stopAll();
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  ctx = ac;
  const step = 1 / (META.resolution * 2);
  const loops = 2;
  const barSteps = META.resolution * META.n_beat_bars;
  const t0 = ac.currentTime + 0.1;

  for (let loop = 0; loop < loops; loop++) {
    const base = t0 + loop * META.n_steps * step;
    for (const part of parts) {
      if (!part || !part.notes) continue;
      for (const [i, pitch, vel] of part.notes) {
        if (vel <= 0) continue;
        const at = base + i * step;
        const level = Math.min(vel, 1);
        if (part.voice === "tap") {
          stickTap(ac, at, level * 0.5, part.pan ?? 0.55);
        } else {
          const v = VOICES[part.voice];
          pianoNote(ac, at, lift(pitch, v.lift), v.gain, level,
                    part.pan ?? v.pan, v.ring);
        }
      }
    }
    if ($("click").checked) {
      for (let i = 0; i < META.n_steps; i += META.resolution) {
        const downbeat = i % barSteps === 0;
        const osc = ac.createOscillator();
        osc.type = "square";
        osc.frequency.value = downbeat ? 2000 : 1400;
        const g = ac.createGain();
        g.gain.setValueAtTime(downbeat ? 0.13 : 0.07, base + i * step);
        g.gain.exponentialRampToValueAtTime(0.0001, base + i * step + 0.03);
        osc.connect(g); g.connect(ac.destination);
        osc.start(base + i * step); osc.stop(base + i * step + 0.05);
      }
    }
  }
  return loops * META.n_steps * step + 3;
}

// Any play button is also its own stop button while it is the thing playing
function playFrom(btn, parts) {
  const wasThisOne = playing && playing.btn === btn;
  stopAll();
  if (wasThisOne) return;
  const seconds = play(parts);
  playing = { btn, label: btn.textContent, timer: setTimeout(stopAll, seconds * 1000) };
  btn.textContent = "■ stop";
  btn.classList.add("playing");
}

const asNotes = (hits, pitch) =>
  hits.map((v, i) => [i, pitch, v]).filter(([, , v]) => v > 0);

// A drum part's note numbers are instruments rather than pitches - 35 is a kick and 38 a snare -
// so it is tapped rather than played, and never transposed: moving it three semitones would swap
// which drum is hit. The same goes for reading one as the key to fit a pitched part against.
const percussive = (part) => part === "Drums";
const inputVoice = () => (percussive(META.part_1) ? "tap" : "melody");
const partnerVoice = () => (percussive(META.part_2) ? "tap" : "bass");

function fitShift(heard, segNotes) {
  if (percussive(META.part_1) || percussive(META.part_2)) return 0;
  return keyShift(heard, segNotes);
}

const inputPart = () =>
  pitched ? { notes: pitched, voice: inputVoice() }
          : { notes: asNotes(input, META.part_1_pitch), voice: inputVoice() };

// ---------- grid ----------
function spacing(i) {
  if (i === 0) return "";
  if (i % (META.resolution * META.n_beat_bars) === 0) return "bar";
  if (i % META.resolution === 0) return "beat";
  return "";
}

function buildGrids() {
  const n = META.n_steps;
  for (const [id, editable] of [["inGrid", true], ["outGrid", false], ["probGrid", false]]) {
    const g = $(id);
    g.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    g.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      const cls = spacing(i);
      if (id === "probGrid") {
        d.className = ("prob " + cls).trim();
        d.appendChild(document.createElement("i")).style.height = "0%";
      } else {
        d.className = ("cell " + cls).trim();
      }
      if (editable) d.onclick = () => cycle(i);
      g.appendChild(d);
    }
  }
}

// Click cycles a step through the velocity bins the model was trained on
const LEVELS = [0, 0.25, 0.5, 0.75, 1.0];
function cycle(i) {
  const at = LEVELS.indexOf(Math.min(...LEVELS.filter((l) => l >= input[i] - 1e-6)));
  input[i] = LEVELS[(at + 1) % LEVELS.length];
  dropPitches();
  drawInput();
}

// The pitches belong to the segment that was loaded; an edited grid is no longer that segment
function dropPitches() {
  if (!pitched) return;
  pitched = null;
  exampleName = "";
  $("playPitched").disabled = true;
  setMeta();
}

// Velocity is the alpha; for the output the hue carries the relationship to the input
const HUES = { in: "106,169,255", together: "86,211,100", gap: "255,140,90" };
function shade(v, hue) {
  if (v <= 0) return "#23272f";
  return `rgba(${HUES[hue]},${0.28 + 0.72 * Math.min(v, 1)})`;
}

function drawInput() {
  const cells = $("inGrid").children;
  for (let i = 0; i < input.length; i++) cells[i].style.background = shade(input[i], "in");
  drawDescriptors();
  // Editing the grid changes what the mashups have to fit, so their shifts are recomputed
  if (matches.length) drawMatches();
}

function drawOutput() {
  const cells = $("outGrid").children;
  const bars = $("probGrid").children;
  $("playOut").disabled = !output;
  $("playBoth").disabled = !output;
  for (let i = 0; i < META.n_steps; i++) {
    if (!output) {
      cells[i].style.background = "#23272f";
      bars[i].firstChild.style.height = "0%";
      continue;
    }
    cells[i].style.background = shade(
      output.gen_hits[i], output.together.includes(i) ? "together" : "gap");
    const bar = bars[i].firstChild;
    bar.style.height = `${Math.round(output.onset_probs[i] * 100)}%`;
    bar.style.background = output.onset_probs[i] > 0.5 ? "#6b7686" : "#3f4754";
  }
}

const fmt = (v) => {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  return Number.isInteger(+v) ? String(+v) : (+v).toFixed(3);
};

// What the two paired descriptors from the thesis mean, shown on hover wherever they appear
const DESCRIBES = {
  onset_balance: "1 when both parts play the same number of onsets, 0 when one part plays all of them",
  antiphony: "0 when both parts' onsets centre on the same point in the two bars, rising as one crowds the start and the other the end",
};

function statRow(name, value) {
  const tip = DESCRIBES[name] ? ` title="${DESCRIBES[name]}"` : "";
  return `<span class="metric"${tip}><b>${fmt(value)}</b>${name}</span>`;
}

function drawDescriptors() {
  const onsets = input.filter((v) => v > 0).length;
  $("inDesc").innerHTML =
    `<div class="metrics">${statRow("onsets", onsets)}` +
    META.descriptors.map((k) => statRow(k, output ? output.descriptors.input[k] : null)).join("") +
    `</div>`;

  if (!output) {
    $("outDesc").innerHTML = "";
    return;
  }
  $("outDesc").innerHTML =
    `<div class="metrics">` +
    statRow("onsets", output.out_onsets.length) +
    META.descriptors.map((k) => statRow(k, output.descriptors.output[k])).join("") +
    `</div><div class="metrics paired">` +
    META.paired_descriptors.map((k) => statRow(k, output.paired[k])).join("") +
    `</div>`;
}

// ---------- key fit ----------
// Segments arrive in whatever key they were recorded in, so each is moved to sit with the input
// before it is heard against it. Two terms, both measured against the input as it will actually
// sound: how much of the segment lands on a pitch class the input uses, less what collides with
// it on the same step. Semitones and tritones are the collisions that read as wrong.
const CLASH_PENALTY = 2;
const pitchClass = (p) => ((p % 12) + 12) % 12;
const intervalClass = (a, b) => {
  const d = Math.abs(a - b) % 12;
  return Math.min(d, 12 - d);
};

function keyShift(heard, segNotes) {
  if (!segNotes.length || !heard.length) return 0;

  const share = new Array(12).fill(0);
  for (const [, p, v] of heard) share[pitchClass(p)] += v;
  const total = share.reduce((a, b) => a + b, 0);
  if (!total) return 0;

  const byStep = new Map();
  for (const [s, p, v] of heard) byStep.set(s, (byStep.get(s) || []).concat([[p, v]]));

  let best = 0, bestScore = -Infinity;
  // Half an octave either way, so a part stays in the register it was recorded in
  for (let t = -6; t <= 5; t++) {
    let score = 0;
    for (const [s, p, v] of segNotes) {
      const pc = pitchClass(p + t);
      score += (v * share[pc]) / total;
      for (const [q, w] of byStep.get(s) || []) {
        const cls = intervalClass(pc, pitchClass(q));
        if (cls === 1 || cls === 6) score -= CLASH_PENALTY * v * w;
      }
    }
    // Ties go to the smaller move
    if (score > bestScore + 1e-9 ||
        (Math.abs(score - bestScore) < 1e-9 && Math.abs(t) < Math.abs(best))) {
      bestScore = score;
      best = t;
    }
  }
  return best;
}

const transpose = (notes, semitones) =>
  semitones ? notes.map(([s, p, v]) => [s, p + semitones, v]) : notes;

// ---------- mashups ----------
function drawMatches() {
  const box = $("matches");
  if (!matches.length) {
    box.innerHTML = '<span class="hint">No matches.</span>';
    return;
  }
  box.innerHTML =
    `<div class="hdr"><span class="spacer"></span><span class="apart">apart</span>` +
    `<span class="mid">${META.part_2} rhythm</span><span class="shift">shift</span>` +
    `<span class="who">segment</span></div>`;

  const heard = inputPart().notes;

  matches.forEach((m, ix) => {
    const rowEl = document.createElement("div");
    rowEl.className = "match";

    const shift = fitShift(heard, m.pitched);

    const btn = document.createElement("button");
    btn.textContent = "▶";
    btn.title = "Play this against the input";
    btn.onclick = () => playFrom(btn, [
      inputPart(),
      { notes: transpose(m.pitched, shift), voice: partnerVoice() },
    ]);
    rowEl.appendChild(btn);

    const apart = document.createElement("span");
    apart.className = "apart";
    apart.textContent = `${m.steps_apart} step${m.steps_apart === 1 ? "" : "s"}`;
    rowEl.appendChild(apart);

    const mini = document.createElement("div");
    mini.className = "mini";
    mini.style.gridTemplateColumns = `repeat(${META.n_steps}, 1fr)`;
    for (let i = 0; i < META.n_steps; i++) {
      const c = document.createElement("i");
      c.className = spacing(i);
      const mine = m.hits[i] > 0;
      const theirs = output && output.gen_hits[i] > 0;
      // Where this segment and the generated rhythm agree, and where they part company
      if (mine && theirs) c.style.background = "rgba(86,211,100,0.85)";
      else if (mine) c.style.background = "rgba(255,140,90,0.85)";
      else if (theirs) c.style.background = "#3b4250";
      mini.appendChild(c);
    }
    rowEl.appendChild(mini);

    const shiftEl = document.createElement("span");
    shiftEl.className = "shift";
    shiftEl.textContent = shift > 0 ? `+${shift}` : `${shift}`;
    shiftEl.title = shift
      ? `Moved ${Math.abs(shift)} semitone${Math.abs(shift) === 1 ? "" : "s"} ` +
        `${shift > 0 ? "up" : "down"} to fit the input`
      : "Already fits the input";
    rowEl.appendChild(shiftEl);

    const who = document.createElement("span");
    who.className = "who";
    who.textContent = `${m.name}  (${m.pitched.length} notes)`;
    who.title = m.name;
    rowEl.appendChild(who);

    box.appendChild(rowEl);
  });
}

async function findMatches() {
  $("matches").innerHTML = '<span class="hint">Searching the dataset…</span>';
  const res = await fetch("/neighbors", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: META.model_id, hits: output.gen_hits, k: 10 }),
  });
  const body = await res.json();
  if (body.error) {
    $("matches").innerHTML = `<span class="hint">${body.error}</span>`;
    return;
  }
  matches = body.matches;
  drawMatches();
}

// ---------- wiring ----------
function buildSteer() {
  $("steer").innerHTML =
    META.paired_descriptors.map((k) => `
      <div class="line">
        <label class="check nm" title="${DESCRIBES[k]}"><input type="checkbox" data-on="${k}"> ${k}</label>
        <input type="range" data-target="${k}" min="0" max="1" step="0.01" value="0.5">
        <span class="tv" id="tv-${k}">0.50</span>
        <span id="got-${k}"></span>
      </div>`).join("") +
    `<div class="line"><span class="nm">candidates</span>
       <select id="nCand">
         <option>16</option><option selected>48</option><option>128</option>
       </select></div>`;

  META.paired_descriptors.forEach((k) => {
    document.querySelector(`[data-target="${k}"]`).oninput = (e) => {
      $(`tv-${k}`).textContent = (+e.target.value).toFixed(2);
    };
  });
}

// Only the descriptors whose box is ticked are steered toward
function steerTargets() {
  const targets = {};
  META.paired_descriptors.forEach((k) => {
    if (document.querySelector(`[data-on="${k}"]`).checked) {
      targets[k] = parseFloat(document.querySelector(`[data-target="${k}"]`).value);
    }
  });
  return Object.keys(targets).length ? targets : null;
}

function drawSteerResult() {
  META.paired_descriptors.forEach((k) => {
    const el = $(`got-${k}`);
    if (!el) return;
    const search = output && output.search;
    if (!search || !(k in search.targets)) { el.textContent = ""; return; }
    const got = output.paired[k];
    const reach = search.reachable[k];
    const missed = got === null || Math.abs(got - search.targets[k]) > 0.05;
    el.className = missed ? "miss" : "got";
    el.textContent = `got ${fmt(got)}` +
      (reach ? `   (${search.n_candidates} candidates spanned ${fmt(reach.min)}–${fmt(reach.max)})` : "");
  });
}

// 3,334,176 -> "3.3M"
const millions = (n) =>
  n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}K` : String(n);

function setMeta() {
  $("inSeg").textContent = exampleName;
  $("mashupNote").textContent =
    `The closest matches out of ${META.n_index.toLocaleString()} searchable ${META.part_2} segments.`;
  $("meta").textContent = `${millions(META.n_params)} params`;
  setValLoss(META.final_eval.val_loss);
}

function setValLoss(loss) {
  $("valLoss").textContent = loss === null || loss === undefined ? "" : `val loss ${(+loss).toFixed(2)}`;
  $("valLoss").title =
    "Mean cross-entropy per token on the validation split, which the model never trained on";
}

async function generate() {
  $("gen").disabled = true;
  try {
    const res = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: META.model_id,
        hits: input,
        sampler: $("sampler").value,
        temperature: parseFloat($("temp").value),
        nucleus_p: parseFloat($("pp").value),
        targets: steerTargets(),
        n_candidates: parseInt($("nCand").value, 10),
      }),
    });
    const body = await res.json();
    if (body.error) { alert(body.error); return; }
    output = body;
    drawOutput();
    drawDescriptors();
    drawSteerResult();
  } finally {
    $("gen").disabled = false;
  }
  await findMatches();
}

async function loadExample() {
  const res = await fetch(`/example?model=${encodeURIComponent(META.model_id)}`);
  const body = await res.json();
  if (body.error) { alert(body.error); return; }
  input = body.hits.slice();
  pitched = body.pitched;
  exampleName = body.name;
  // With a drum part this would play the same taps as the rhythm button, since the note
  // numbers are instruments rather than pitches
  $("playPitched").disabled = !(pitched && pitched.length) || percussive(META.part_1);
  $("playPitched").title = percussive(META.part_1)
    ? "A drum part has no pitches to hear"
    : "Play the input as it was recorded";
  drawInput();
  setMeta();
}

async function selectModel(modelId) {
  stopAll();
  META = await (await fetch(`/meta?model=${encodeURIComponent(modelId)}`)).json();
  $("model").value = META.model_id;
  $("inLabel").textContent = META.part_1;
  $("outLabel").textContent = META.part_2;
  input = new Array(META.n_steps).fill(0);
  output = null;
  matches = [];
  pitched = null;
  exampleName = "";
  $("playPitched").disabled = true;
  buildGrids();
  buildSteer();
  drawInput();
  drawOutput();
  drawDescriptors();
  setMeta();
  if (META.has_examples) { await loadExample(); await generate(); }
}

(async function init() {
  const first = await (await fetch("/meta")).json();
  $("model").innerHTML = first.models
    .map((m) => `<option value="${m.id}">${m.label}</option>`).join("");
  await selectModel(first.model_id);

  $("model").onchange = (e) => selectModel(e.target.value);
  $("clear").onclick = () => {
    input.fill(0); output = null; matches = []; dropPitches();
    drawInput(); drawOutput(); drawMatches();
  };
  $("rand").onclick = loadExample;
  $("preset").onclick = () => {
    input = input.map((_, i) => (i % 2 === 0 ? 1.0 : 0));
    dropPitches();
    drawInput();
  };
  $("gen").onclick = generate;
  $("playIn").onclick = () => playFrom($("playIn"),
    [{ notes: asNotes(input, META.part_1_pitch), voice: "melody" }]);
  $("playPitched").onclick = () => pitched &&
    playFrom($("playPitched"), [{ notes: pitched, voice: "melody" }]);
  $("playOut").onclick = () => output &&
    playFrom($("playOut"), [{ notes: asNotes(output.gen_hits, 0), voice: "tap" }]);
  $("playBoth").onclick = () => output && playFrom($("playBoth"), [
    inputPart(),
    { notes: asNotes(output.gen_hits, 0), voice: "tap" },
  ]);
  $("temp").oninput = (e) => $("tempV").textContent = (+e.target.value).toFixed(2);
  $("pp").oninput = (e) => $("ppV").textContent = (+e.target.value).toFixed(2);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") generate();
    if (e.key === "Escape") stopAll();
  });
})();
</script>
</body>
</html>
