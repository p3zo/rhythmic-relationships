<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rhythmic relationships</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2c313a; --text: #e6e8ec;
    --dim: #8b93a1; --in: #6aa9ff; --out: #ffb454; --both: #56d364; --gap: #ff7b72;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 17px; margin: 0 0 2px; font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 18px; margin-top: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .label { width: 132px; flex: none; color: var(--dim); font-size: 12px; text-align: right; }
  .grid { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .cell { height: 34px; border-radius: 3px; background: #23272f; position: relative;
          border: 1px solid transparent; }
  .cell.beat, .prob.beat { margin-left: 3px; }
  .cell.bar, .prob.bar { margin-left: 9px; }
  .in .cell { cursor: pointer; }
  .in .cell:hover { outline: 1px solid var(--in); }
  .prob { height: 26px; background: #23272f; border-radius: 3px; display: flex;
          align-items: flex-end; overflow: hidden; }
  .prob i { display: block; width: 100%; background: #4b5563; }
  button, select { background: #262b33; color: var(--text); border: 1px solid var(--line);
                   border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: #4a5568; }
  button.primary { background: var(--in); color: #08121f; border-color: var(--in); font-weight: 600; }
  input[type=range] { width: 130px; vertical-align: middle; }
  table { border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 12px; }
  th, td { text-align: right; padding: 3px 12px 3px 0; }
  th { color: var(--dim); font-weight: 500; }
  td.name { text-align: left; color: var(--dim); }
  .stats { display: flex; gap: 26px; flex-wrap: wrap; font-family: ui-monospace, monospace;
           font-size: 12px; }
  .stat b { display: block; font-size: 20px; font-family: inherit; font-weight: 600; }
  .key { color: var(--dim); font-size: 11px; margin-top: 10px; font-family: ui-monospace, monospace; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 12px; }
  .hint { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>rhythmic relationships</h1>
  <div class="meta" id="meta">loading…</div>

  <div class="panel">
    <div class="row">
      <div class="label" id="inLabel">input</div>
      <div class="grid in" id="inGrid"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="label"></div>
      <button id="clear">Clear</button>
      <button id="rand">Random real input</button>
      <button id="preset">Straight 8ths</button>
      <button class="primary" id="gen">Generate ⏎</button>
      <span style="flex:1"></span>
      <button id="playIn">▶ input</button>
      <button id="playOut">▶ model</button>
      <button id="playBoth">▶ both</button>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="label">sampler</div>
      <select id="sampler">
        <option value="nucleus">nucleus</option>
        <option value="multinomial">multinomial</option>
        <option value="greedy">greedy</option>
      </select>
      <span class="hint">temperature <input type="range" id="temp" min="0.3" max="2" step="0.05" value="1">
        <span id="tempV">1.00</span></span>
      <span class="hint">nucleus p <input type="range" id="pp" min="0.5" max="1" step="0.01" value="0.92">
        <span id="ppV">0.92</span></span>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <div class="label" id="outLabel">output</div>
      <div class="grid" id="outGrid"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="label">P(onset)</div>
      <div class="grid" id="probGrid"></div>
    </div>
    <div class="key">
      <span class="sw" style="background:rgb(86,211,100)"></span>onset on an input onset
      <span class="sw" style="background:rgb(255,140,90)"></span>onset in an input gap
      <span class="sw" style="background:#4b5563"></span>the model's onset probability at that step
    </div>
  </div>

  <div class="panel" id="rel">
    <div class="stats" id="stats"><span class="hint">Generate to see how the output relates to the input.</span></div>
    <div style="margin-top:18px" id="descTable"></div>
  </div>
</div>

<script>
let META = null;
let input = [];
let output = null;

const $ = (id) => document.getElementById(id);
const midiHz = (n) => 440 * Math.pow(2, (n - 69) / 12);

// Group the grid into beats and bars by spacing, so the divisions survive a filled cell
function spacing(i) {
  if (i === 0) return "";
  if (i % (META.resolution * META.n_beat_bars) === 0) return " bar";
  if (i % META.resolution === 0) return " beat";
  return "";
}

function buildGrids() {
  const n = META.n_steps;
  for (const [id, editable] of [["inGrid", true], ["outGrid", false], ["probGrid", false]]) {
    const g = $(id);
    g.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    g.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      if (id === "probGrid") {
        d.className = "prob" + spacing(i);
        const bar = document.createElement("i");
        bar.style.height = "0%";
        bar.style.background = "#4b5563";
        d.appendChild(bar);
      } else {
        d.className = "cell" + spacing(i);
      }
      if (editable) d.onclick = () => { cycle(i); };
      g.appendChild(d);
    }
  }
}

// Click cycles a step through the velocity bins the model was trained on
const LEVELS = [0, 0.25, 0.5, 0.75, 1.0];
function cycle(i) {
  const at = LEVELS.indexOf(Math.min(...LEVELS.filter(l => l >= input[i] - 1e-6)));
  input[i] = LEVELS[(at + 1) % LEVELS.length];
  drawInput();
}

// Velocity is the alpha; for the output the hue carries the relationship to the input
const HUES = { in: "106,169,255", together: "86,211,100", gap: "255,140,90" };
function shade(v, hue) {
  if (v <= 0) return "#23272f";
  return `rgba(${HUES[hue]},${0.28 + 0.72 * Math.min(v, 1)})`;
}

function drawInput() {
  const cells = $("inGrid").children;
  for (let i = 0; i < input.length; i++) cells[i].style.background = shade(input[i], "in");
}

function drawOutput() {
  const cells = $("outGrid").children;
  const bars = $("probGrid").children;
  for (let i = 0; i < META.n_steps; i++) {
    if (!output) { cells[i].style.background = "#23272f"; bars[i].firstChild.style.height = "0%"; continue; }
    cells[i].style.background = shade(
      output.gen_hits[i], output.together.includes(i) ? "together" : "gap");
    const bar = bars[i].firstChild;
    bar.style.height = `${Math.round(output.onset_probs[i] * 100)}%`;
    bar.style.background = output.onset_probs[i] > 0.5 ? "#6b7686" : "#3f4754";
  }
}

function drawRelationship() {
  if (!output) return;
  const nIn = output.in_onsets.length, nOut = output.out_onsets.length;
  const both = output.together.length;
  // Of the model's onsets, how many landed with the input rather than between its notes
  const withInput = nOut ? (100 * both / nOut).toFixed(0) : "–";
  // How much of the input the model answered
  const covered = nIn ? (100 * both / nIn).toFixed(0) : "–";
  $("stats").innerHTML = `
    <div class="stat"><b>${nIn}</b>input onsets</div>
    <div class="stat"><b>${nOut}</b>model onsets</div>
    <div class="stat"><b>${both}</b>shared steps</div>
    <div class="stat"><b>${withInput}%</b>of model onsets on an input onset</div>
    <div class="stat"><b>${covered}%</b>of input onsets answered</div>
    <div class="stat"><b>${output.in_gaps.length}</b>model onsets in gaps</div>`;

  const d = output.descriptors;
  let rows = META.descriptors.map(k => {
    const a = d.input[k], b = d.output[k];
    const f = (v) => (v === null || v === undefined) ? "–" : (+v).toFixed(3);
    return `<tr><td class="name">${k}</td><td>${f(a)}</td><td>${f(b)}</td></tr>`;
  }).join("");
  $("descTable").innerHTML =
    `<table><tr><th class="name" style="text-align:left">descriptor</th>
     <th>${META.part_1}</th><th>${META.part_2}</th></tr>${rows}</table>`;
}

async function generate() {
  $("gen").disabled = true;
  $("gen").textContent = "…";
  try {
    const res = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        hits: input,
        sampler: $("sampler").value,
        temperature: parseFloat($("temp").value),
        nucleus_p: parseFloat($("pp").value),
      }),
    });
    const body = await res.json();
    if (body.error) { alert(body.error); return; }
    output = body;
    drawOutput();
    drawRelationship();
  } finally {
    $("gen").disabled = false;
    $("gen").textContent = "Generate ⏎";
  }
}

// One sine burst per onset, input panned left and output right, looped twice
function play(parts) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const step = 1 / (META.resolution * 2);
  const bars = 2;
  for (let loop = 0; loop < bars; loop++) {
    for (const p of parts) {
      if (!p.hits) continue;
      const pan = ctx.createStereoPanner();
      pan.pan.value = p.pan;
      pan.connect(ctx.destination);
      p.hits.forEach((v, i) => {
        if (v <= 0) return;
        const t = ctx.currentTime + 0.08 + loop * META.n_steps * step + i * step;
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = midiHz(p.pitch);
        const g = ctx.createGain();
        g.gain.setValueAtTime(Math.min(v, 1) * 0.35, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        osc.connect(g); g.connect(pan);
        osc.start(t); osc.stop(t + 0.2);
      });
    }
  }
}

async function loadExample() {
  const res = await fetch("/example");
  if (!res.ok) { alert("Server was started with --examples 0, so there are no real inputs."); return; }
  const body = await res.json();
  input = body.hits.slice();
  drawInput();
  $("inLabel").textContent = META.part_1;
  $("meta").textContent = META.line + "   ·   " + body.name;
}

(async function init() {
  META = await (await fetch("/meta")).json();
  META.line = [
    `${META.part_1} → ${META.part_2}`,
    `${META.n_steps} steps`,
    `${META.n_params.toLocaleString()} params`,
    `val ${META.final_eval.val_loss ?? "?"}`,
    META.dataset_name,
  ].join("  ·  ");
  $("meta").textContent = META.line;
  $("inLabel").textContent = META.part_1 + " (input)";
  $("outLabel").textContent = META.part_2 + " (model)";
  input = new Array(META.n_steps).fill(0);
  buildGrids();
  drawInput();

  $("clear").onclick = () => { input.fill(0); output = null; drawInput(); drawOutput(); };
  $("rand").onclick = loadExample;
  $("preset").onclick = () => {
    input = input.map((_, i) => (i % 2 === 0 ? 1.0 : 0));
    drawInput();
  };
  $("gen").onclick = generate;
  $("playIn").onclick = () => play([{ hits: input, pitch: META.part_1_pitch, pan: -0.7 }]);
  $("playOut").onclick = () => output && play([{ hits: output.gen_hits, pitch: META.part_2_pitch, pan: 0.7 }]);
  $("playBoth").onclick = () => play([
    { hits: input, pitch: META.part_1_pitch, pan: -0.7 },
    { hits: output ? output.gen_hits : null, pitch: META.part_2_pitch, pan: 0.7 },
  ]);
  $("temp").oninput = (e) => $("tempV").textContent = (+e.target.value).toFixed(2);
  $("pp").oninput = (e) => $("ppV").textContent = (+e.target.value).toFixed(2);
  document.addEventListener("keydown", (e) => { if (e.key === "Enter") generate(); });

  // Land on something playable rather than an empty grid
  if (META.n_examples) { await loadExample(); await generate(); }
})();
</script>
</body>
</html>
