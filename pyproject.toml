[project]
name = "rhythmic-relationships"
version = "0.1.0"
authors = [{ name = "p3zo" }]
# `rhythmtoolbox` pins numpy~=1.24.2 and scipy~=1.10.1, which caps everything downstream of them.
# numpy 1.24 has no wheels for 3.12, so the upper bound is a real constraint, not caution.
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib~=3.7.0",
    "numpy~=1.24.2",
    "pandas~=2.0.0",
    "pillow>=9.5.0",
    "pretty_midi~=0.2.10",
    "pyyaml~=6.0",
    "rhythmtoolbox",
    "scipy~=1.10.1",
    "seaborn~=0.12.0",
    "torch>=2.0",
    "tqdm~=4.64",
    "wandb>=0.15",
    "x-transformers>=1.16,<3",
]

[project.urls]
Homepage = "https://github.com/p3zo/rhythmic-relationships"

[project.optional-dependencies]
# Only needed by the analysis scripts, not by the library
experimental = ["scikit-learn~=1.3.0"]

[dependency-groups]
dev = [
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "pytest",
    "pytest-cov",
]

[tool.uv.sources]
# `rhythmtoolbox` is not published to PyPI, so it is resolved straight from git. That makes this
# project installable by uv but not from a package index, which is fine for a research repo.
rhythmtoolbox = { git = "https://github.com/danielgomezmarin/rhythmtoolbox" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rhythmic_relationships"]
